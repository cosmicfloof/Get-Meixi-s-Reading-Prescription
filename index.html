<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Psychological Basement</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <!-- START SCREEN -->

<section id="start-screen">

  <p class="result-label">
    MEIXI'S PSYCHOLOGICAL BASEMENT
  </p>

  <h1>Which Intellectual Crisis Are You?</h1>

      <p class="intro">
        Eight questions. Six possible diagnoses.
        Absolutely no clinical validity.
      </p>

      <button id="start-button">
        GET MEIXI’S READING PRESCRIPTION
      </button>

    </section>


    <!-- QUIZ SCREEN -->

    <section id="quiz-screen" style="display: none;">

      <p id="progress"></p>

      <h2 id="question-text"></h2>

      <div id="answers"></div>

    </section>


    <!-- RESULT SCREEN -->

    <section id="result-screen" style="display: none;">

      <p class="result-label">
        PSYCHOLOGICAL BASEMENT DIAGNOSIS
      </p>

      <h1 id="result-title"></h1>

      <h3>Your intellectual condition:</h3>
      <p id="result-description"></p>

      <h3>Symptoms:</h3>
      <p id="result-symptoms"></p>

      <h3>Prescribed philosophers:</h3>
      <p id="result-philosophers"></p>

      <h3>Meixi’s reading prescription:</h3>

      <div id="recommendations"></div>

      <button id="restart-button">
        REQUEST A SECOND OPINION
      </button>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
